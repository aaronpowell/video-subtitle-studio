[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "video-subtitle-studio"
version = "0.1.2"
description = "Self-hosted MP4 transcription, caption editing, and broadcast subtitle export"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Aaron Powell" }]
dependencies = [
  "fastapi>=0.115,<1",
  "moonshine-voice==0.1.5",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[project.scripts]
video-subtitle-studio = "subtitle_studio.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/subtitle_studio"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
